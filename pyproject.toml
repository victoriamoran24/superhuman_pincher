[project]
name = "superhuman-pincher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Victoria Moran", email = "victoriamoran@berkeley.edu" },
    { name = "Kellen Galban", email = "kellengalban751@berkeley.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "groq>=1.7.0",
    "kokoro-onnx>=0.6.1",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
superhuman_pincher = "superhuman_pincher:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
